{{- if .Values.crds.enabled }}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    controller-gen.kubebuilder.io/version: v0.20.1
  name: hcloudnodeclasses.karpenter.itsh.dev
spec:
  group: karpenter.itsh.dev
  names:
    categories:
    - karpenter
    kind: HCloudNodeClass
    listKind: HCloudNodeClassList
    plural: hcloudnodeclasses
    shortNames:
    - hcnc
    - hcncs
    singular: hcloudnodeclass
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.image.name
      name: Image
      type: string
    - jsonPath: .status.network.name
      name: Network
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          HCloudNodeClass describes how to build a Hetzner Cloud server that will join
          this cluster as a node.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              HCloudNodeClassSpec is the desired shape of a node.

              Fields carrying `hash:"ignore"` are either readable back from the Hetzner API
              on a live server, so drift compares them against the server rather than a
              stored hash, or policy about when to replace a node, which must not itself
              replace every node when edited. Everything else is hashed, because hcloud
              will not return it once the server exists: notably user_data (write-only) and
              ssh_keys (absent from the server representation entirely).
            properties:
              bootstrap:
                description: Bootstrap describes how the node installs and joins.
                properties:
                  apiServerEndpoint:
                    description: |-
                      APIServerEndpoint overrides the discovered join endpoint, as host:port.
                      Normally empty: it is read at runtime from kube-public/cluster-info. Set
                      it when cluster-info advertises an endpoint nodes should not use, such as
                      a public address where nodes should join over the private network.
                    type: string
                  caCertHashes:
                    description: |-
                      CACertHashes overrides the discovered CA public-key pins, in
                      "sha256:<hex>" form. Normally empty and computed at runtime from
                      cluster-info as the SPKI hash, matching kubeadm's
                      --discovery-token-ca-cert-hash.
                    items:
                      pattern: ^sha256:[a-f0-9]{64}$
                      type: string
                    type: array
                  containerd:
                    description: ContainerdSpec configures the container runtime.
                    properties:
                      aptPin:
                        default: 2.*
                        description: |-
                          AptPin constrains the containerd.io package version, as an apt version
                          glob. The default holds containerd within its current major: unattended
                          upgrades should patch it, but crossing a major changes the CRI plugin
                          configuration shape and breaks the additional runtime handler wired into
                          it.
                        type: string
                      extraConfig:
                        description: |-
                          ExtraConfig is TOML appended to /etc/containerd/config.toml before
                          containerd first starts, which is where additional runtime handlers go.
                          The CRI plugin's config path changed between containerd majors, so the
                          stanza must match whatever AptPin selects.
                        type: string
                      systemdCgroup:
                        default: true
                        description: SystemdCgroup sets the systemd cgroup driver.
                        type: boolean
                    type: object
                  extraFiles:
                    description: ExtraFiles are additional files to write during cloud-init.
                    items:
                      description: File is a file written during cloud-init.
                      properties:
                        content:
                          type: string
                        owner:
                          default: root
                          type: string
                        path:
                          type: string
                        permissions:
                          default: "0644"
                          description: Permissions is an octal mode string, e.g. "0644".
                          pattern: ^0[0-7]{3}$
                          type: string
                      required:
                      - content
                      - path
                      type: object
                    type: array
                  extraPackages:
                    description: ExtraPackages are additional apt packages to install.
                    items:
                      type: string
                    type: array
                  kernelModules:
                    description: KernelModules are loaded at boot via /etc/modules-load.d.
                    items:
                      type: string
                    type: array
                  kubernetesVersion:
                    description: |-
                      KubernetesVersion is the full version to install, e.g. "1.34.7". The apt
                      repository stream comes from its major.minor and the pinned package
                      version from the whole string plus PackageRevision. Changing it drifts
                      the fleet, which is the supported upgrade path.
                    pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
                    type: string
                  mode:
                    default: Managed
                    description: |-
                      BootstrapMode selects how userData is produced. Single-valued today; a
                      Custom mode taking a raw blob is the obvious future addition.
                    enum:
                    - Managed
                    type: string
                  osFamily:
                    default: Debian
                    description: |-
                      OSFamily is the node operating system family.

                      Single-valued today: first-class kubeadm and containerd fields, rather than
                      an opaque userData blob, are what allow per-NodeClaim bootstrap tokens,
                      correct taint rendering and one source of truth for kubelet reservations.
                      The cost is hard-coding Debian, apt, kubeadm and containerd. Anything else
                      goes through ExtraPackages, ExtraFiles (written before runcmd, so an apt
                      source and its key land in time) and the join hooks.
                    enum:
                    - Debian
                    type: string
                  packageRevision:
                    default: "1.1"
                    description: |-
                      PackageRevision is the Debian package revision suffix, e.g. "1.1",
                      producing kubelet=1.34.7-1.1.
                    type: string
                  packageUpgradeOnBoot:
                    default: true
                    description: |-
                      PackageUpgradeOnBoot runs a full package upgrade during cloud-init and,
                      when the upgrade asks for one, reboots before joining, so a new kernel is
                      the one the node runs. It adds one to four minutes to every boot, plus
                      about one for the reboot, and depends on mirror speed, against karpenter
                      core's hardcoded 15-minute registration timeout, so a slow mirror day can
                      produce a replacement loop. The durable fix is a prebuilt image; this is
                      the lever until then.
                    type: boolean
                  postJoinCommands:
                    description: PostJoinCommands run after a successful kubeadm join.
                    items:
                      type: string
                    type: array
                  preJoinCommands:
                    description: PreJoinCommands run after packages are configured,
                      before kubeadm join.
                    items:
                      type: string
                    type: array
                  revision:
                    description: |-
                      Revision is an arbitrary string with no effect other than being hashed:
                      the deliberate "roll the fleet now" lever. Bump it and every NodeClaim
                      drifts, so Karpenter replaces nodes one at a time inside the disruption
                      budget and respecting PDBs. spec.maxNodeAge is the automatic path, the
                      same drift on a schedule; expireAfter is forceful and cannot be
                      budget-gated.
                    type: string
                  sysctls:
                    additionalProperties:
                      type: string
                    description: Sysctls are written to /etc/sysctl.d and applied
                      at boot.
                    type: object
                  unattendedUpgrades:
                    description: UnattendedUpgradesSpec configures Debian unattended-upgrades.
                    properties:
                      enabled:
                        default: true
                        description: Enabled installs and configures unattended-upgrades.
                        type: boolean
                      extraOrigins:
                        description: |-
                          ExtraOrigins are additional origin patterns to allow, e.g. third-party
                          repositories whose packages should also auto-patch.
                        items:
                          type: string
                        type: array
                      removeUnusedKernelPackages:
                        default: true
                        description: |-
                          RemoveUnusedKernelPackages lets unattended-upgrades purge superseded
                          kernels, which otherwise fill /boot.
                        type: boolean
                    type: object
                required:
                - kubernetesVersion
                type: object
              firewallSelectors:
                description: FirewallSelectors picks firewalls to apply.
                items:
                  description: FirewallSelectorTerm selects a Hetzner firewall by
                    name or id.
                  properties:
                    id:
                      format: int64
                      type: integer
                    name:
                      type: string
                  type: object
                  x-kubernetes-validations:
                  - message: exactly one of name or id must be set
                    rule: has(self.name) != has(self.id)
                maxItems: 5
                type: array
              imageDriftPolicy:
                default: Ignore
                description: |-
                  ImageDriftPolicy controls whether a changed image ID drifts nodes.

                  Defaults to Ignore, unlike some other providers: Hetzner rebuilds images
                  such as debian-13 periodically and the ID changes each time, so Replace
                  rolls the whole fleet for no benefit, apt having reconfigured the OS at
                  boot anyway. Use Replace only when pinning a snapshot you version.
                enum:
                - Ignore
                - Replace
                type: string
              imageSelector:
                description: |-
                  ImageSelector picks the base image. Exactly one of name or id: a name
                  follows Hetzner's periodic image rebuilds, an id pins one build forever.
                properties:
                  id:
                    format: int64
                    type: integer
                  name:
                    description: Name of the image, e.g. debian-13.
                    type: string
                type: object
                x-kubernetes-validations:
                - message: exactly one of name or id must be set
                  rule: has(self.name) != has(self.id)
              kubelet:
                description: |-
                  Kubelet is the authoritative source for kubelet reservations.

                  These feed BOTH the scheduling model (InstanceTypeOverhead, how Karpenter
                  computes allocatable) AND the flags the kubelet runs with. One field,
                  because if the two diverge Karpenter overpacks every node by the
                  difference and pods sit Pending on nodes it believes have room.
                properties:
                  clusterDNS:
                    description: ClusterDNS overrides the DNS server addresses passed
                      to the kubelet.
                    items:
                      type: string
                    type: array
                  evictionHard:
                    additionalProperties:
                      type: string
                    description: |-
                      EvictionHard are the hard eviction thresholds. --eviction-hard REPLACES
                      kubelet's entire default map rather than merging into it, so omitting a
                      signal that kubelet defaults to disables that signal entirely.
                    type: object
                  evictionSoft:
                    additionalProperties:
                      type: string
                    description: EvictionSoft are the soft eviction thresholds.
                    type: object
                  evictionSoftGracePeriod:
                    additionalProperties:
                      type: string
                    description: EvictionSoftGracePeriod is the grace period per soft
                      eviction signal.
                    type: object
                  extraArgs:
                    description: |-
                      ExtraArgs are additional kubelet flags, rendered into the kubeadm
                      JoinConfiguration's nodeRegistration.kubeletExtraArgs.
                    items:
                      description: KubeletArg is a single kubelet flag in kubeadm
                        v1beta4's name/value shape.
                      properties:
                        name:
                          type: string
                        value:
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                  kubeReserved:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: KubeReserved is resources reserved for Kubernetes
                      system components.
                    type: object
                  maxPods:
                    description: |-
                      MaxPods caps pods per node. Also the "pods" resource Karpenter bin-packs
                      against.
                    format: int32
                    minimum: 1
                    type: integer
                  systemReserved:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: SystemReserved is resources reserved for OS system
                      daemons.
                    type: object
                type: object
              locations:
                description: |-
                  Locations bounds which Hetzner locations this class may use, e.g.
                  [nbg1, fsn1]. Empty means every location in the network's zone. This is
                  the infrastructure bound; a NodePool's topology.kubernetes.io/region
                  requirement is the policy bound and narrows it further.
                items:
                  pattern: ^[a-z]{2,4}[0-9]$
                  type: string
                maxItems: 10
                type: array
              maxNodeAge:
                description: |-
                  MaxNodeAge drifts a node once its NodeClaim is older than this, so nodes
                  are replaced on a schedule through drift: inside the disruption budget,
                  replacement first, and respecting PDBs. Unset disables it. Prefer it to
                  a NodePool's expireAfter, which deletes the NodeClaim outside the budget.
                pattern: ^([0-9]+(s|m|h))+$
                type: string
                x-kubernetes-validations:
                - message: maxNodeAge must be at least 1h
                  rule: duration(self) >= duration('1h')
              networkSelector:
                description: |-
                  NetworkSelector picks the private network to attach. Without it a node
                  has no route to the API server's private endpoint.
                properties:
                  id:
                    format: int64
                    type: integer
                  name:
                    type: string
                type: object
                x-kubernetes-validations:
                - message: exactly one of name or id must be set
                  rule: has(self.name) != has(self.id)
              placementGroup:
                description: |-
                  PlacementGroup optionally puts nodes in a spread placement group. Unset
                  by default, deliberately: Hetzner caps spread groups at 10 servers, and
                  the eleventh create returns placement_error, indistinguishable from
                  stock exhaustion and not fixable by trying a different server type.
                properties:
                  id:
                    format: int64
                    type: integer
                  name:
                    type: string
                type: object
                x-kubernetes-validations:
                - message: exactly one of name or id must be set
                  rule: has(self.name) != has(self.id)
              publicIPv4:
                default: true
                description: |-
                  PublicIPv4 controls whether nodes get a primary IPv4, billed separately.
                  Without one, nodes need NAT egress to reach apt and registries. When
                  false, the IPv4 surcharge is dropped from the offering price.
                type: boolean
              publicIPv6:
                default: true
                description: PublicIPv6 controls whether nodes get a primary IPv6.
                type: boolean
              serverLabels:
                additionalProperties:
                  type: string
                description: |-
                  ServerLabels are extra hcloud labels for cost allocation and filtering.
                  Merged under the provider-managed labels, which always win.
                maxProperties: 32
                type: object
              sshKeySelectors:
                description: |-
                  SSHKeySelectors picks SSH keys to install. Hashed rather than compared
                  live, because hcloud does not return ssh_keys on a server GET.
                items:
                  description: SSHKeySelectorTerm selects a Hetzner SSH key by name
                    or id.
                  properties:
                    id:
                      format: int64
                      type: integer
                    name:
                      type: string
                  type: object
                  x-kubernetes-validations:
                  - message: exactly one of name or id must be set
                    rule: has(self.name) != has(self.id)
                maxItems: 10
                type: array
            required:
            - bootstrap
            - imageSelector
            type: object
          status:
            description: HCloudNodeClassStatus is the resolved, observed state of
              the class.
            properties:
              apiServerEndpoint:
                description: |-
                  APIServerEndpoint is the join endpoint in use, whether discovered from
                  kube-public/cluster-info or overridden in the spec.
                type: string
              caCertHashes:
                description: |-
                  CACertHashes are the CA public-key pins in use. Safe to publish: it is a
                  public key pin, already served anonymously from kube-public/cluster-info
                  to any unauthenticated client.
                items:
                  type: string
                type: array
              conditions:
                items:
                  description: Condition aliases the upstream type and adds additional
                    helper methods
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              firewalls:
                description: Firewalls are the resolved firewalls.
                items:
                  description: FirewallStatus is a resolved Hetzner firewall.
                  properties:
                    id:
                      format: int64
                      type: integer
                    name:
                      type: string
                  required:
                  - id
                  type: object
                type: array
              image:
                description: Image is the resolved base image.
                properties:
                  architecture:
                    type: string
                  created:
                    type: string
                  description:
                    type: string
                  id:
                    format: int64
                    type: integer
                  name:
                    type: string
                required:
                - id
                type: object
              locations:
                description: Locations are the in-scope locations and their datacenters.
                items:
                  description: LocationStatus is an in-scope Hetzner location.
                  properties:
                    datacenters:
                      items:
                        type: string
                      type: array
                    name:
                      type: string
                    networkZone:
                      type: string
                  required:
                  - name
                  type: object
                type: array
              network:
                description: Network is the resolved private network.
                properties:
                  id:
                    format: int64
                    type: integer
                  ipRange:
                    type: string
                  name:
                    type: string
                  zone:
                    description: Zone is the network zone, which bounds which locations
                      can attach.
                    type: string
                required:
                - id
                type: object
              placementGroup:
                description: PlacementGroup is the resolved placement group, if any.
                properties:
                  id:
                    format: int64
                    type: integer
                  name:
                    type: string
                  serverCount:
                    description: |-
                      ServerCount is the current membership. Hetzner caps spread groups at 10
                      and exceeding that returns placement_error on create, so the ceiling is
                      surfaced before it is hit.
                    type: integer
                  type:
                    type: string
                required:
                - id
                type: object
              sshKeys:
                description: SSHKeys are the resolved SSH keys.
                items:
                  description: SSHKeyStatus is a resolved Hetzner SSH key.
                  properties:
                    fingerprint:
                      type: string
                    id:
                      format: int64
                      type: integer
                    name:
                      type: string
                  required:
                  - id
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
