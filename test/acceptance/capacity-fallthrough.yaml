# Acceptance test: capacity fall-through, deliberately location-independent.
#
# What this exercises, end to end, without depending on stock anywhere:
#
#   1. cx33 ranks first on price, so a healthy nbg1 provisions a cx33 and
#      nothing interesting happens.
#   2. Whenever cx33 IS out of stock in nbg1, the create fails with a
#      capacity-class code, the provider classifies it, marks that
#      (type, location) pair unavailable, and falls through to cpx32. The pod
#      gets a node either way.
#   3. Once cx33 returns and the suppression expires, consolidation simulates
#      replacing the cpx32, finds the replacement cheaper and the pods
#      reschedulable, and executes a REPLACE. cluster-autoscaler can only
#      delete an underutilised node, never replace a wrongly-typed one.
#
# Step 3 needs nothing from the provider beyond an honest Price and Available.
#
# Safe to leave running: one replica means one node, the limit caps it at two if
# anything misbehaves, and the taint keeps real workloads off. Delete the
# NodePool and Deployment when done.
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: acceptance-capacity-fallthrough
  labels:
    karpenter.itsh.dev/acceptance: capacity-fallthrough
spec:
  # Core's limit check is strictly-greater (usage.Cmp(limit) > 0), and it sums
  # NodeClaim CAPACITY, so at exactly 4 the limit is not yet exceeded and a
  # second 4 cpu node is still admitted. This caps the test at TWO nodes, not
  # one. The real single-node bound is the one-replica Deployment below.
  limits:
    cpu: "4"
  disruption:
    # WhenEmptyOrUnderutilized, because step 3 IS consolidation. Restricting to
    # WhenEmpty would remove the very behaviour under test.
    consolidationPolicy: WhenEmptyOrUnderutilized
    # Short, so the replace happens while somebody is watching rather than
    # fifteen minutes after they gave up.
    consolidateAfter: 2m
  template:
    metadata:
      labels:
        karpenter.itsh.dev/acceptance: capacity-fallthrough
    spec:
      nodeClassRef:
        group: karpenter.itsh.dev
        kind: HCloudNodeClass
        name: default
      # Tainted, so nothing real can land here and the test cannot take other
      # workloads down with it when it consolidates.
      taints:
        - key: karpenter.itsh.dev/acceptance
          value: capacity-fallthrough
          effect: NoSchedule
      requirements:
        # Pinned to on-demand, and this is NOT optional on Hetzner.
        #
        # Left unconstrained, the requirement is unbounded, so core's
        # Has(spot) AND Has(on-demand) test is true and consolidation pins
        # every replacement to spot. The launch then fails and is retried
        # roughly every 27 seconds forever, creating and deleting a NodeClaim
        # each time, because Hetzner has no spot capacity.
        - key: karpenter.sh/capacity-type
          operator: In
          values: [on-demand]
        # Two types and nothing else. Price ranks them cx33 then cpx32, so a
        # correct provider takes cx33 whenever it can get one.
        - key: node.kubernetes.io/instance-type
          operator: In
          values: [cx33, cpx32]
        # nbg1 ONLY. Constraining the location is what makes this runnable at
        # any time: it tests the fall-through BETWEEN TYPES rather than between
        # locations, so it never depends on stock in a particular datacenter.
        - key: topology.kubernetes.io/region
          operator: In
          values: [nbg1]
      # An expiry would replace the node on a timer and confuse the reading.
      expireAfter: Never
---
# One pod, sized so exactly one node is needed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: acceptance-capacity-fallthrough
  namespace: default
  labels:
    karpenter.itsh.dev/acceptance: capacity-fallthrough
spec:
  replicas: 1
  selector:
    matchLabels:
      app: acceptance-capacity-fallthrough
  template:
    metadata:
      labels:
        app: acceptance-capacity-fallthrough
    spec:
      nodeSelector:
        karpenter.itsh.dev/acceptance: capacity-fallthrough
      tolerations:
        - key: karpenter.itsh.dev/acceptance
          operator: Equal
          value: capacity-fallthrough
          effect: NoSchedule
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              # Big enough that the node is not "empty" and therefore has to be
              # REPLACED rather than simply deleted.
              cpu: "1"
              memory: 512Mi
      terminationGracePeriodSeconds: 0
