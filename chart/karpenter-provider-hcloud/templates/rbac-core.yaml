{{/*
Karpenter CORE's RBAC, kept deliberately separate from this provider's own.

These rules belong to sigs.k8s.io/karpenter's controllers, so they change when
the pinned core version changes, not when this provider does. Mixing them into
the provider's ClusterRole makes it impossible to tell, later, which rules exist
because of a decision here and which because core needs them.

The rule: grant what core calls at the pinned version with this provider,
including paths behind a gate or flag. Upstream's core ClusterRole is the
checklist, minus what only its kwok provider uses (nodes create, nodes/status),
and escalation paths are granted only with their gate.

Hand-enumerating this set is a known trap: it is easy to miss podtemplates,
namespaces and replicationcontrollers, which core reads to resolve pod owners
during consolidation, and the failure is a permission error inside a disruption
decision rather than at startup.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "karpenter-provider-hcloud.fullname" . }}-core
  labels:
    {{- include "karpenter-provider-hcloud.labels" . | nindent 4 }}
rules:
  # --- Read ---
  - apiGroups: [karpenter.sh]
    resources: [nodepools, nodepools/status, nodeclaims, nodeclaims/status]
    verbs: [get, list, watch]
  # Feature-gated controllers. Their CRDs are not installed here, so these
  # grant access to nothing unless something else installs them. Kept so that
  # enabling a gate later fails on the missing CRD, which says what it is,
  # rather than on RBAC, which does not.
  - apiGroups: [karpenter.sh]
    resources: [nodeoverlays, nodeoverlays/status]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling.x-k8s.io]
    resources: [capacitybuffers, capacitybuffers/status]
    verbs: [get, list, watch]
  # podtemplates, namespaces and replicationcontrollers are read to resolve a
  # pod's owner when deciding whether it may be disrupted. services is read
  # only when SCHEDULER_CONFIG sets default topology spread constraints.
  - apiGroups: [""]
    resources: [pods, nodes, persistentvolumes, persistentvolumeclaims, replicationcontrollers, namespaces, podtemplates, services]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses, csinodes, volumeattachments]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [daemonsets, deployments, replicasets, statefulsets]
    verbs: [get, list, watch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [events]
    verbs: [get, list, watch]

  # --- Write ---
  #
  # NodeClaims are created and deleted by core's provisioning and disruption
  # controllers. This is the grant that lets karpenter add and remove nodes at
  # all.
  - apiGroups: [karpenter.sh]
    resources: [nodeclaims, nodeclaims/status]
    verbs: [create, delete, update, patch]
  - apiGroups: [karpenter.sh]
    resources: [nodepools, nodepools/status, nodeoverlays/status]
    verbs: [update, patch]
  - apiGroups: [autoscaling.x-k8s.io]
    resources: [capacitybuffers/status]
    verbs: [update, patch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  # delete on nodes is the sharp one, and it is unavoidable: terminating a
  # NodeClaim means removing its Node. It is bounded by karpenter only ever
  # acting on Nodes carrying a providerID it recognises as its own, which for
  # this provider means a server carrying this cluster's ownership label.
  - apiGroups: [""]
    resources: [nodes]
    verbs: [patch, delete, update]
  - apiGroups: [""]
    resources: [pods/eviction]
    verbs: [create]
  - apiGroups: [""]
    resources: [pods]
    verbs: [delete]
  {{- if (.Values.controller.featureGates | default dict).PodDeletionCostManagement }}
  # Only with the gate that annotates pods with a deletion cost. Patch on pods
  # is an escalation path: spec.containers[*].image is mutable, so the holder
  # can run code under any pod's ServiceAccount.
  - apiGroups: [""]
    resources: [pods]
    verbs: [patch, update]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "karpenter-provider-hcloud.fullname" . }}-core
  labels:
    {{- include "karpenter-provider-hcloud.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "karpenter-provider-hcloud.fullname" . }}-core
subjects:
  - kind: ServiceAccount
    name: {{ include "karpenter-provider-hcloud.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
