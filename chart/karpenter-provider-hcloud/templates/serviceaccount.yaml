{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "karpenter-provider-hcloud.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "karpenter-provider-hcloud.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The pod needs a projected token to reach the API server, so this stays on.
automountServiceAccountToken: true
{{- end }}
